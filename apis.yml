name: Artificial Intelligence Underwriting Company
description: 'Artificial Intelligence Underwriting Company (AIUC) is a San Francisco-based
  AI agent standards and insurance company that builds confidence infrastructure for
  enterprises adopting AI agents. It pairs AIUC-1 — described as the world''s first AI
  agent standard, spanning data & privacy, security, safety, reliability, accountability,
  and societal risk — with insurance products that protect organizations against AI agent
  failures. Developed with input from over 100 Fortune 500 CISOs and mapped to frameworks
  including ISO 42001, NIST AI RMF, and MITRE ATLAS, AIUC certifies AI agents against
  defined controls through accredited auditors. The company is backed by Emergence Capital
  and does not currently publish a public API or developer surface.'
